name: APEXONE Release


on:

  push:

    tags:

      - "v*"


jobs:


  release:


    name: Create Release


    runs-on: ubuntu-latest


    permissions:

      contents: write


    steps:


    - name: Checkout Repository

      uses: actions/checkout@v4



    - name: Read Version

      id: version

      shell: bash

      run: |

        VERSION=$(cat VERSION)

        echo "version=$VERSION" >> $GITHUB_OUTPUT



    - name: Validate Version

      shell: bash

      run: |

        test -f VERSION



    - name: Create Deployment Package

      shell: bash

      run: |

        zip -r APEXONE-${{ steps.version.outputs.version }}.zip \
        database \
        application \
        automation \
        docs \
        README.md \
        LICENSE \
        VERSION



    - name: Create GitHub Release

      uses: softprops/action-gh-release@v2

      with:

        name: APEXONE ${{ steps.version.outputs.version }}

        files:

          APEXONE-${{ steps.version.outputs.version }}.zip